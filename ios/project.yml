name: BenYacovManage
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
settings:
  base:
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: PRY2S55YGY
    CODE_SIGN_STYLE: Automatic
targets:
  BenYacovManage:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: ביקורת פאריטי מול ראוטי השרת
        script: |
          cd "$PROJECT_DIR" && /usr/bin/python3 scripts/parity_audit.py
        basedOnDependencyAnalysis: false
      - name: ביקורת פאריטי payload מול הדסקטופ
        script: |
          cd "$PROJECT_DIR" && /usr/bin/python3 scripts/payload_parity_audit.py
        basedOnDependencyAnalysis: false
      - name: ביקורת פאריטי פקדי UI מול הדסקטופ
        script: |
          cd "$PROJECT_DIR" && /usr/bin/python3 scripts/ui_parity_audit.py
        basedOnDependencyAnalysis: false
      - name: ביקורת מזהי טסטים מול קוד האפליקציה
        script: |
          cd "$PROJECT_DIR" && /usr/bin/python3 scripts/testid_audit.py
        basedOnDependencyAnalysis: false
    sources:
      - path: BenYacovManage
        excludes:
          - "Info.plist"
    dependencies:
      - target: BenYacovShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benyacov.mobile
        PRODUCT_NAME: BenYacovManage
        INFOPLIST_FILE: BenYacovManage/Info.plist
        CODE_SIGN_ENTITLEMENTS: BenYacovManage/BenYacovManage.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ENABLE_TESTABILITY: true
        INFOPLIST_KEY_CFBundleDisplayName: בן יעקב
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
  BenYacovShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BenYacovShare
        excludes:
          - "Info.plist"
      # ליבת ההעלאה משותפת עם האפליקציה הראשית (ונבדקת ביחידה דרכה).
      - path: BenYacovManage/Shared/ShareUploadCore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benyacov.mobile.share
        INFOPLIST_FILE: BenYacovShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: BenYacovShare/BenYacovShare.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: בן יעקב
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1,2"
  BenYacovClassic:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BenYacovClassic
      # ליבה משותפת עם האפליקציה הראשית — אותם חוזים, אותם חישובים.
      - path: BenYacovManage/Core/AppConfig.swift
      - path: BenYacovManage/Core/JSONValue.swift
      - path: BenYacovManage/Core/Haptics.swift
      - path: BenYacovManage/DesignSystem/BYTheme.swift
      - path: BenYacovManage/Core/APIClient.swift
      - path: BenYacovManage/Core/APIClientFlows.swift
      - path: BenYacovManage/Core/Domain.swift
      - path: BenYacovManage/Core/DomainRecord.swift
      - path: BenYacovManage/Core/PaymentsMath.swift
      - path: BenYacovManage/Core/FinanceInvoices.swift
      - path: BenYacovManage/Core/Formatters.swift
      - path: BenYacovManage/Core/FieldLabels.swift
      - path: BenYacovManage/Core/EditFormKind.swift
      - path: BenYacovManage/Core/BiometricAuthenticator.swift
      - path: BenYacovManage/Core/CustomerDomains.swift
      - path: BenYacovManage/Core/InstallationStatus.swift
      - path: BenYacovManage/Core/MockTransport.swift
      - path: BenYacovManage/Features/Domains/DomainActions.swift
      - path: BenYacovManage/Resources/Fixtures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benyacov.mobile.classic
        PRODUCT_NAME: BenYacovClassic
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 2
        SUPPORTS_MACCATALYST: false
        ENABLE_TESTABILITY: true
        INFOPLIST_KEY_CFBundleDisplayName: בן יעקב קלאסי
        INFOPLIST_KEY_NSFaceIDUsageDescription: "הזיהוי הביומטרי משמש לנעילת האפליקציה ולכניסה מהירה."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  BenYacovClassicUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BenYacovClassicUITests
    dependencies:
      - target: BenYacovClassic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benyacov.mobile.classic.uitests
        TEST_TARGET_NAME: BenYacovClassic
        GENERATE_INFOPLIST_FILE: true
  BenYacovManageTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BenYacovManageTests
    dependencies:
      - target: BenYacovManage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benyacov.mobile.tests
        GENERATE_INFOPLIST_FILE: true
  BenYacovManageUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BenYacovManageUITests
    dependencies:
      - target: BenYacovManage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benyacov.mobile.uitests
        TEST_TARGET_NAME: BenYacovManage
        GENERATE_INFOPLIST_FILE: true
schemes:
  BenYacovClassic:
    build:
      targets:
        BenYacovClassic: all
        BenYacovClassicUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BenYacovClassicUITests
  BenYacovManage:
    build:
      targets:
        BenYacovManage: all
        BenYacovManageTests: [test]
        BenYacovManageUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BenYacovManageTests
        - BenYacovManageUITests
      gatherCoverageData: true
